<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>SprachSchach</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(59,130,246,.18), transparent 38rem),
        linear-gradient(160deg, #0b1020, #111827 55%, #0b1020);
      color: #f8fafc;
    }
    main {
      width: min(92vw, 760px);
      padding: 3rem 2rem;
      text-align: center;
    }
    .knight {
      font-size: clamp(4rem, 12vw, 7rem);
      line-height: 1;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,.35));
    }
    h1 {
      margin: 1rem 0 .5rem;
      font-size: clamp(2.4rem, 8vw, 4.8rem);
      letter-spacing: -.04em;
    }
    p {
      margin: .5rem auto;
      max-width: 42rem;
      color: #cbd5e1;
      font-size: 1.1rem;
      line-height: 1.65;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-top: 1.6rem;
      padding: .8rem 1rem;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      color: #e2e8f0;
      backdrop-filter: blur(10px);
    }
    .dot {
      width: .7rem;
      height: .7rem;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 16px rgba(34,197,94,.75);
    }
    footer {
      margin-top: 2.5rem;
      color: #64748b;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="knight" aria-hidden="true">♞</div>
    <h1>SprachSchach</h1>
    <p>Die Weboberfläche für das SprachSchach-Projekt ist eingerichtet.</p>
    <p>Diese Seite kann jetzt Schritt für Schritt um Schachbrett, Spracheingabe und Spiellogik erweitert werden.</p>
    <div class="status"><span class="dot"></span> GitHub Pages bereit</div>
    <footer>SprachSchach · PeterPan1926</footer>
  </main>
</body>
</html>
