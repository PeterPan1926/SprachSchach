name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', '*.js', '*.css', 'index.html']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build and lint APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SprachSchach-Menue-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Test installed app on Android 35
        working-directory: android
        timeout-minutes: 12
        run: |
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name SprachSchachTest --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd SprachSchachTest -no-window -no-audio -no-snapshot -no-boot-anim -accel on -gpu auto -memory 2048 -cores 2 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          "$ANDROID_HOME/platform-tools/adb" start-server
          for attempt in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo 'Android emulator exited before boot' >> "$GITHUB_STEP_SUMMARY"
              tail -80 "$RUNNER_TEMP/emulator.log" >> "$GITHUB_STEP_SUMMARY"
              diagnostic=$(tail -12 "$RUNNER_TEMP/emulator.log" | tr '\n' ' ')
              echo "::error title=Android emulator startup failed::$diagnostic"
              exit 1
            fi
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            sleep 5
          done
          if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" != 1 ]; then
            echo 'Android emulator did not finish boot' >> "$GITHUB_STEP_SUMMARY"
            tail -80 "$RUNNER_TEMP/emulator.log" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
          ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-test-results
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
