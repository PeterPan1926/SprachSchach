name: Android Release
on:
  push:
    tags: ['android-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build and lint APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Prepare download and checksum
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/SprachSchach-Menue-1.0.1.apk
          cd release-assets
          sha256sum SprachSchach-Menue-1.0.1.apk > SprachSchach-Menue-1.0.1.apk.sha256
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease \
            --title "SprachSchach Menü für Android 1.0.1" \
            --notes-file android/RELEASE-NOTES.md \
            release-assets/SprachSchach-Menue-1.0.1.apk \
            release-assets/SprachSchach-Menue-1.0.1.apk.sha256
