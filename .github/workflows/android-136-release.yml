name: Android 1.36 Menu Release
on:
  push:
    tags: ['android-136-menu-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release-Tag für die vorbereitete Version (aktuell android-136-menu-v7)'
        required: true
        default: android-136-menu-v7
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check persistent signing key
        env:
          ANDROID136_KEYSTORE_BASE64: ${{ secrets.ANDROID136_KEYSTORE_BASE64 }}
          ANDROID136_KEYSTORE_PASSWORD: ${{ secrets.ANDROID136_KEYSTORE_PASSWORD }}
          ANDROID136_CERT_SHA256: ${{ vars.ANDROID136_CERT_SHA256 }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^android-136-menu-v[0-9]+$ ]] || { echo 'Ungültiger Release-Tag'; exit 1; }
          python android-136-menu/sign-apk.py
      - name: Prepare build tools and original APK
        run: |
          python -m pip install PyYAML==6.0.2
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          mkdir -p native136
          curl -fL --retry 3 -o native136/original.apk https://github.com/PeterPan1926/SprachSchach/releases/download/sprach_schach_v1_36/SprachSchach-1.36.apk
          curl -fL --retry 3 -o native136/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar
          echo 'ed63efbc299c7aea551dcc66e6808a59ea11c34898b45579cc219396cd247af4  native136/original.apk' | sha256sum --check
          echo '66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  native136/apktool.jar' | sha256sum --check
      - name: Build original app with top menus
        run: |
          java -jar native136/apktool.jar d -f -p native136/framework -o native136/decoded native136/original.apk
          python android-136-menu/prepare.py native136/decoded
          java -jar native136/apktool.jar b -p native136/framework -o native136/unsigned.apk native136/decoded
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 native136/unsigned.apk native136/SprachSchach-1.36-Menue.apk
      - name: Sign with persistent release key
        env:
          ANDROID136_KEYSTORE_BASE64: ${{ secrets.ANDROID136_KEYSTORE_BASE64 }}
          ANDROID136_KEYSTORE_PASSWORD: ${{ secrets.ANDROID136_KEYSTORE_PASSWORD }}
          ANDROID136_CERT_SHA256: ${{ vars.ANDROID136_CERT_SHA256 }}
        run: |
          python android-136-menu/sign-apk.py native136/SprachSchach-1.36-Menue.apk --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          cd native136
          sha256sum SprachSchach-1.36-Menue.apk > SprachSchach-1.36-Menue.apk.sha256
      - name: Publish menu variant
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --prerelease --title 'SprachSchach 1.36 Menü – zusammengefasste Partie-Menüs' --notes-file android-136-menu/README.md native136/SprachSchach-1.36-Menue.apk native136/SprachSchach-1.36-Menue.apk.sha256
